name: Deploy FastAPI to EC2 (Direct Build)
on:
  push:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "main.py"
      - "config/**"
      - "core/**"
      - "exception/**"
      - "models/**"
      - "routers/**"
      - "services/**"
      - "repositories/**"
      - ".github/workflows/deploy-fastapi.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: |
            Dockerfile,
            requirements.txt,
            main.py,
            config/**,
            core/**,
            exception/**,
            models/**,
            routers/**,
            services/**,
            repositories/**
          target: "/home/ubuntu/Boini/fastapi"
          overwrite: true
          strip_components: 0

      - name: Build & Restart FastAPI via Docker Compose
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/Boini
            docker compose config >/dev/null
            docker compose up -d --build fastapi
            sleep 5
            docker exec nginx-container nginx -t
            docker exec nginx-container nginx -s reload
            # curl -fsS https://api.boini.shop/ai/healthz  # [수정] DNS 연결 전까지 헬스체크 주석처리
            echo "Deploy OK"
